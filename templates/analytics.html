{% extends "base.html" %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/analytics.css') }}">
{% endblock %}

{% block title %}Analytics - Spendly{% endblock %}

{% block content %}
<div class="coming-soon-container">
    <div class="coming-soon-content">
        <div class="coming-soon-icon">

{% endblock %}
